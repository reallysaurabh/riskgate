name: release
# Build once, check, then publish exactly those files (PyPA trusted publishing; no tokens in the repository).
#   manual run (workflow_dispatch) -> TestPyPI  (environment "testpypi"; pending publisher on test.pypi.org)
#   GitHub release (published)     -> PyPI      (environment "pypi";     pending publisher on pypi.org)
# The publish jobs are separate from the build so build steps never hold the OIDC token.
on:
  release: {types: [published]}
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/riskgate version
          /tmp/smoke/bin/python -c "import riskgate, sys; assert not {'pandas', 'scipy', 'mcp'} & set(sys.modules)"
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {repository-url: "https://test.pypi.org/legacy/"}

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
