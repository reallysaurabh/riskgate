site_name: riskgate
site_description: "Certify, reject or ask: distribution-free risk control for the actions of LLM agents"
site_author: Saurabh Gupta
copyright: Copyright &copy; 2026 Saurabh Gupta · Apache-2.0
repo_url: https://github.com/reallysaurabh/riskgate
repo_name: reallysaurabh/riskgate
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - github-callouts            # GitHub-style "> [!NOTE]" alerts, as used throughout docs/ (package: markdown-callouts)
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js   # renders the $...$ / $$...$$ math of SPEC.md and calibration.md

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Quickstart: quickstart.md
  - End-to-end tutorial: end_to_end.md
  - Bring your own domain: byo_domain.md
  - Use cases: use_cases.md
  - Calibration & guarantees: calibration.md
  - Operations: operations.md
  - Integrations: integrations.md
  - CLI: cli.md
  - Configuration: configuration.md
  - API reference: api.md
  - FAQ: faq.md
  - Results: results.md
  - Results on real agents: results_real_agents.md
  - Specification: SPEC.md
