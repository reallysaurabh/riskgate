[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskgate"
version = "1.0.0rc6"
description = "Certify, reject or ask: distribution-free risk control for the actions of LLM agents"
readme = "README.md"
authors = [{ name = "Saurabh Gupta", email = "saurabhgupta3012@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
  "llm", "agents", "ai agents", "tool calling", "guardrails", "agent safety", "prompt injection", "mcp",
  "conformal prediction", "conformal risk control", "risk control", "safety", "digital twin",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.5", "mypy>=1.10"]
examples = ["matplotlib>=3.7"]
yaml = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# framework extras: minimum versions are the ones the contract tests run against (docs/integrations.md)
mcp = ["mcp>=2.3,<3"]
langgraph = ["langgraph>=1.2", "langgraph-prebuilt>=1.1", "langchain-core>=1.6"]
adk = ["google-adk>=2.11"]
openai-agents = ["openai-agents>=0.23"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.168"]
docs = ["mkdocs-material>=9.5", "markdown-callouts>=0.4"]

[project.scripts]
riskgate = "riskgate.cli:main"

[project.urls]
Homepage = "https://github.com/reallysaurabh/riskgate"
Repository = "https://github.com/reallysaurabh/riskgate"
Documentation = "https://reallysaurabh.github.io/riskgate/"
Changelog = "https://github.com/reallysaurabh/riskgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/reallysaurabh/riskgate/issues"

[tool.setuptools.packages.find]
include = ["riskgate*"]

[tool.setuptools.package-data]
riskgate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the doer_id warning is asserted in tests/test_warnings.py; elsewhere it is expected noise
filterwarnings = ["ignore::riskgate.RiskGateWarning"]

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["examples/cstr_lib", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "UP007", "UP045", "B905", "E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["examples/", "tests/", "paper/"]
